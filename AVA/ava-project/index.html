<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Ambiente Virtual de Aprendizagem (AVA) do Hospital Alpha - Central de Treinamentos e Capacitação Interna.">
    <title>AVA Hospitalar — Ambiente Virtual de Aprendizagem</title>
    <!-- CSS Principal -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-setor="home">

    <!-- Hero Section -->
    <section class="hero" aria-label="Introdução do Portal">
        <div class="container">
            <div class="hero-content">
                <h1 class="hero-title">Ambiente Virtual de Aprendizagem</h1>
            </div>
        </div>
    </section>

    <!-- Conteúdo Principal -->
    <main class="main-content">
        <div class="container">
            
            <!-- Grid de Setores -->
            <section class="sectors-section" aria-labelledby="sectors-title">
                <div class="section-header">
                    <div>
                        <h2 class="section-title" id="sectors-title">Selecione seu Setor</h2>
                        <p class="section-subtitle">Escolha sua área de atuação para visualizar os procedimentos e treinamentos correspondentes.</p>
                    </div>
                </div>
                
                <div class="sectors-grid" id="sectors-grid">
                    <!-- Injetado dinamicamente via assets/js/app.js -->
                </div>
            </section>

        </div>
    </main>

    <!-- Scripts do Sistema -->
    <script src="assets/js/data.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
